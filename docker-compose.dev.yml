version: "3.8"

services:
  # Go API Backend - Development
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: textcraft-api-dev
    ports:
      - "8080:8080"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PORT=8080
      - GO_ENV=development
    volumes:
      # Mount source code for hot reloading (if using air or similar)
      - ./api:/app
    networks:
      - textcraft-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend - Development
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile.dev
    container_name: textcraft-ui-dev
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
    volumes:
      # Mount source code for hot reloading
      - ./ui/src:/app/src
      - ./ui/public:/app/public
      - ./ui/index.html:/app/index.html
      - ./ui/vite.config.ts:/app/vite.config.ts
      - ./ui/tsconfig.json:/app/tsconfig.json
      - ./ui/tsconfig.app.json:/app/tsconfig.app.json
      - ./ui/tsconfig.node.json:/app/tsconfig.node.json
      - ./ui/tailwind.config.ts:/app/tailwind.config.ts
      - ./ui/postcss.config.js:/app/postcss.config.js
    depends_on:
      api:
        condition: service_healthy
    networks:
      - textcraft-network
    restart: unless-stopped

networks:
  textcraft-network:
    driver: bridge
