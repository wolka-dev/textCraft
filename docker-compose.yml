version: "3.8"

services:
  # Go API Backend
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: phrasing-craft-api
    ports:
      - "8080:8080"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PORT=8080
    networks:
      - phrasing-craft-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: phrasing-craft-ui
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - phrasing-craft-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:80/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  phrasing-craft-network:
    driver: bridge
# Optional: Add volumes for development
# Uncomment the following if you want to mount source code for development
# volumes:
#   api-src:
#   ui-src:
