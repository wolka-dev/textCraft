version: "3.8"

services:
  # Go API Backend
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: textcraft-api
    ports:
      - "38080:38080"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-}
      - PORT=38080
    networks:
      - textcraft-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:38080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: textcraft-ui
    ports:
      - "33000:33000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - textcraft-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:33000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  textcraft-network:
    driver: bridge
# Optional: Add volumes for development
# Uncomment the following if you want to mount source code for development
# volumes:
#   api-src:
#   ui-src:
