name: Deploy Phrasing Craft to Server

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

env:
  REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
  IMAGE_NAME: textcraft

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json

    - name: Install Go dependencies
      run: |
        cd api
        go mod download
        go mod verify

    - name: Run Go tests
      run: |
        cd api
        go test -v ./...

    - name: Install UI dependencies
      run: |
        cd ui
        npm ci

    - name: Run UI tests
      run: |
        cd ui
        npm run lint
        npm run build

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Registry
      run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY_URL }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: ./api
        file: ./api/Dockerfile
        push: true
        tags: ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push UI image
      uses: docker/build-push-action@v5
      with:
        context: ./ui
        file: ./ui/Dockerfile
        push: true
        tags: ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}-ui:${{ github.sha }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Update latest tags
      run: |
        docker tag ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }} ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}-api:latest
        docker tag ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}-ui:${{ github.sha }} ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}-ui:latest
        docker push ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}-api:latest
        docker push ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}-ui:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Set environment variables
          export REGISTRY_URL="${{ secrets.REGISTRY_URL }}"
          export IMAGE_NAME="textcraft"
          export COMMIT_SHA="${{ github.sha }}"
          export GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}"
          
          # Create application directory
          mkdir -p /opt/textcraft
          cd /opt/textcraft
          
          # Pull latest images
          echo "Pulling latest images..."
          docker pull $REGISTRY_URL/$IMAGE_NAME-api:latest
          docker pull $REGISTRY_URL/$IMAGE_NAME-ui:latest
          
          # Stop and remove existing containers
          echo "Stopping existing containers..."
          docker stop textcraft-api textcraft-ui || true
          docker rm textcraft-api textcraft-ui || true
          
          # Create network if it doesn't exist
          docker network create textcraft-network || true
          
          # Run API container
          echo "Starting API container..."
          docker run -d \
            --restart=always \
            --name textcraft-api \
            --network textcraft-network \
            -p 8080:8080 \
            -e GROQ_API_KEY="$GROQ_API_KEY" \
            $REGISTRY_URL/$IMAGE_NAME-api:latest
          
          # Wait for API to be ready
          echo "Waiting for API to be ready..."
          sleep 10
          
          # Run UI container
          echo "Starting UI container..."
          docker run -d \
            --restart=always \
            --name textcraft-ui \
            --network textcraft-network \
            -p 3000:80 \
            $REGISTRY_URL/$IMAGE_NAME-ui:latest
          
          # Health check
          echo "Performing health check..."
          sleep 5
          
          # Check API health
          if curl -f http://localhost:8080/health; then
            echo "✅ API is healthy"
          else
            echo "❌ API health check failed"
            exit 1
          fi
          
          # Check UI health
          if curl -f http://localhost:3000; then
            echo "✅ UI is healthy"
          else
            echo "❌ UI health check failed"
            exit 1
          fi
          
          # Clean up old images
          echo "Cleaning up old images..."
          docker image prune -f
          
          echo "🚀 Deployment completed successfully!"
          echo "API: http://${{ secrets.SSH_HOST }}:8080"
          echo "UI: http://${{ secrets.SSH_HOST }}:3000"

  notify:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    
    steps:
    - name: Notify deployment status
      run: |
        if [ "${{ needs.deploy.result }}" == "success" ]; then
          echo "✅ Deployment successful!"
          echo "🌐 Application is live at:"
          echo "   API: http://${{ secrets.SSH_HOST }}:8080"
          echo "   UI: http://${{ secrets.SSH_HOST }}:3000"
        else
          echo "❌ Deployment failed!"
          echo "Check the logs for more details."
        fi
