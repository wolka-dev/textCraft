name: Deploy TextCraft to Server

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

env:
  REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
  IMAGE_NAME: textcraft

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json

    - name: Install Go dependencies
      run: |
        cd api
        go mod download
        go mod verify

    - name: Run Go tests
      run: |
        cd api
        go test -v ./...

    - name: Install UI dependencies
      run: |
        cd ui
        npm ci

    - name: Run UI tests
      run: |
        cd ui
        npm run lint
        npm run build

  build-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json

    - name: Install Go dependencies
      run: |
        cd api
        go mod download
        go mod verify

    - name: Run Go tests
      run: |
        cd api
        go test -v ./...

    - name: Install UI dependencies
      run: |
        cd ui
        npm ci

    - name: Run UI tests
      run: |
        cd ui
        npm run lint
        npm run build

  build-and-push:
    runs-on: ubuntu-latest
    needs: build-test
    if: always() && needs.build-test.result == 'success' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Check registry configuration
      run: |
        if [ -z "${{ secrets.REGISTRY_URL }}" ]; then
          echo "⚠️  REGISTRY_URL secret is not set. Building images locally only."
          echo "To enable Docker registry push, set these secrets:"
          echo "  - REGISTRY_URL (e.g., docker.io/yourusername or ghcr.io/yourusername)"
          echo "  - REGISTRY_USERNAME"
          echo "  - REGISTRY_PASSWORD"
          echo "Setting PUSH_IMAGES=false"
          echo "PUSH_IMAGES=false" >> $GITHUB_ENV
        else
          echo "✅ Registry configured: ${{ secrets.REGISTRY_URL }}"
          echo "PUSH_IMAGES=true" >> $GITHUB_ENV
        fi

    - name: Log in to Docker Registry
      if: env.PUSH_IMAGES == 'true'
      run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY_URL }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.REGISTRY_URL || 'localhost' }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build API image
      uses: docker/build-push-action@v5
      with:
        context: ./api
        file: ./api/Dockerfile
        push: ${{ env.PUSH_IMAGES == 'true' }}
        tags: |
          ${{ secrets.REGISTRY_URL || 'localhost' }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}
          ${{ secrets.REGISTRY_URL || 'localhost' }}/${{ env.IMAGE_NAME }}-api:latest
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build UI image
      uses: docker/build-push-action@v5
      with:
        context: ./ui
        file: ./ui/Dockerfile
        push: ${{ env.PUSH_IMAGES == 'true' }}
        tags: |
          ${{ secrets.REGISTRY_URL || 'localhost' }}/${{ env.IMAGE_NAME }}-ui:${{ github.sha }}
          ${{ secrets.REGISTRY_URL || 'localhost' }}/${{ env.IMAGE_NAME }}-ui:latest
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build summary
      run: |
        echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **API Image**: ${{ secrets.REGISTRY_URL || 'localhost' }}/${{ env.IMAGE_NAME }}-api:latest" >> $GITHUB_STEP_SUMMARY
        echo "- **UI Image**: ${{ secrets.REGISTRY_URL || 'localhost' }}/${{ env.IMAGE_NAME }}-ui:latest" >> $GITHUB_STEP_SUMMARY
        if [ "${{ env.PUSH_IMAGES }}" == "true" ]; then
          echo "- **Status**: ✅ Images pushed to registry" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Status**: ⚠️ Images built locally only (registry not configured)" >> $GITHUB_STEP_SUMMARY
        fi

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always() && needs.build-and-push.result == 'success' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check deployment configuration
      run: |
        if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_USER }}" ] || [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
          echo "⚠️  SSH deployment secrets are not configured."
          echo "To enable server deployment, set these secrets:"
          echo "  - SSH_HOST (your server IP/domain)"
          echo "  - SSH_USER (SSH username)"
          echo "  - SSH_PRIVATE_KEY (SSH private key)"
          echo "  - GROQ_API_KEY (your Groq API key)"
          echo "Setting DEPLOY_TO_SERVER=false"
          echo "DEPLOY_TO_SERVER=false" >> $GITHUB_ENV
        else
          echo "✅ SSH deployment configured"
          echo "DEPLOY_TO_SERVER=true" >> $GITHUB_ENV
        fi

    - name: Deploy to Server
      if: env.DEPLOY_TO_SERVER == 'true'
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Set environment variables
          export REGISTRY_URL="${{ secrets.REGISTRY_URL }}"
          export IMAGE_NAME="textcraft"
          export COMMIT_SHA="${{ github.sha }}"
          export GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}"
          
          # Create application directory
          mkdir -p /opt/textcraft
          cd /opt/textcraft
          
          # Check if registry is configured
          if [ -z "$REGISTRY_URL" ]; then
            echo "⚠️  No registry configured. Cannot pull images."
            echo "Please set REGISTRY_URL secret to enable deployment."
            exit 1
          fi
          
          # Pull latest images
          echo "Pulling latest images from $REGISTRY_URL..."
          docker pull $REGISTRY_URL/$IMAGE_NAME-api:latest
          docker pull $REGISTRY_URL/$IMAGE_NAME-ui:latest
          
          # Stop and remove existing containers
          echo "Stopping existing containers..."
          docker stop textcraft-api textcraft-ui || true
          docker rm textcraft-api textcraft-ui || true
          
          # Create network if it doesn't exist
          docker network create textcraft-network || true
          
          # Run API container
          echo "Starting API container..."
          docker run -d \
            --restart=always \
            --name textcraft-api \
            --network textcraft-network \
            -p 8080:8080 \
            -e GROQ_API_KEY="$GROQ_API_KEY" \
            $REGISTRY_URL/$IMAGE_NAME-api:latest
          
          # Wait for API to be ready
          echo "Waiting for API to be ready..."
          sleep 10
          
          # Run UI container
          echo "Starting UI container..."
          docker run -d \
            --restart=always \
            --name textcraft-ui \
            --network textcraft-network \
            -p 3000:80 \
            $REGISTRY_URL/$IMAGE_NAME-ui:latest
          
          # Health check
          echo "Performing health check..."
          sleep 5
          
          # Check API health
          if curl -f http://localhost:8080/health; then
            echo "✅ API is healthy"
          else
            echo "❌ API health check failed"
            exit 1
          fi
          
          # Check UI health
          if curl -f http://localhost:3000; then
            echo "✅ UI is healthy"
          else
            echo "❌ UI health check failed"
            exit 1
          fi
          
          # Clean up old images
          echo "Cleaning up old images..."
          docker image prune -f
          
          echo "🚀 Deployment completed successfully!"
          echo "API: http://${{ secrets.SSH_HOST }}:8080"
          echo "UI: http://${{ secrets.SSH_HOST }}:3000"

    - name: Deployment summary
      if: always()
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        if [ "${{ env.DEPLOY_TO_SERVER }}" == "true" ]; then
          echo "- **Status**: ✅ Deployed to server" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: http://${{ secrets.SSH_HOST }}:8080" >> $GITHUB_STEP_SUMMARY
          echo "- **UI**: http://${{ secrets.SSH_HOST }}:3000" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Status**: ⚠️ Deployment skipped (SSH secrets not configured)" >> $GITHUB_STEP_SUMMARY
          echo "- **Reason**: Missing SSH_HOST, SSH_USER, or SSH_PRIVATE_KEY secrets" >> $GITHUB_STEP_SUMMARY
        fi

  notify:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    
    steps:
    - name: Notify deployment status
      run: |
        if [ "${{ needs.deploy.result }}" == "success" ]; then
          echo "✅ Deployment successful!"
          echo "🌐 Application is live at:"
          echo "   API: http://${{ secrets.SSH_HOST }}:8080"
          echo "   UI: http://${{ secrets.SSH_HOST }}:3000"
        else
          echo "❌ Deployment failed!"
          echo "Check the logs for more details."
        fi
