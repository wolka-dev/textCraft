name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to Wolka Docker Registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY_URL }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

      - name: Build and Push API Image
        run: |
          docker build -t ${{ secrets.REGISTRY_URL }}/textcraft-api:latest ./api
          docker push ${{ secrets.REGISTRY_URL }}/textcraft-api:latest

      - name: Build and Push UI Image
        run: |
          docker build -t ${{ secrets.REGISTRY_URL }}/textcraft-ui:latest ./ui
          docker push ${{ secrets.REGISTRY_URL }}/textcraft-ui:latest

      - name: SSH into Server and Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.REGISTRY_URL }}/textcraft-api:latest
            docker pull ${{ secrets.REGISTRY_URL }}/textcraft-ui:latest
            docker stop textcraft-api textcraft-ui || true
            docker rm textcraft-api textcraft-ui || true
            docker network create root_npm-network || true
            docker run -d \
              --restart=always \
              --name textcraft-api \
              --network root_npm-network \
              -p 38080:8080 \
              -e GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
              -e PORT=8080 \
              ${{ secrets.REGISTRY_URL }}/textcraft-api:latest
            docker run -d \
              --restart=always \
              --name textcraft-ui \
              --network root_npm-network \
              -p 33000:80 \
              ${{ secrets.REGISTRY_URL }}/textcraft-ui:latest
