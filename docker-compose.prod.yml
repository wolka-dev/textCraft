version: "3.8"

services:
  # Go API Backend
  api:
    image: ${REGISTRY_URL}/textcraft-api:latest
    container_name: textcraft-api
    ports:
      - "38080:38080"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-}
      - PORT=38080
    networks:
      - textcraft-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:38080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # React Frontend
  ui:
    image: ${REGISTRY_URL}/textcraft-ui:latest
    container_name: textcraft-ui
    ports:
      - "33000:33000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - textcraft-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:33000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  textcraft-network:
    driver: bridge
